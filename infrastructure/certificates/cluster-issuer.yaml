# ==============================================================================
# Step 1: Self-Signed Issuer to bootstrap the Root CA
# ==============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# ==============================================================================
# Step 2: Generate a 10-year Root Certificate Authority (CA)
# ==============================================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: "Homelab Root CA"
  secretName: homelab-root-ca-secret
  duration: 87600h # 10 years
  renewBefore: 720h # 30 days
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
---
# ==============================================================================
# Step 3: Cluster-wide CA Issuer that signs application TLS certificates
# ==============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca-issuer
spec:
  ca:
    secretName: homelab-root-ca-secret
