# Grants kube-apiserver (user=apiserver-kubelet-client) permission to proxy
# kubectl exec, logs, and port-forward requests to Talos node kubelets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apiserver-kubelet-client-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kubelet-api-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: apiserver-kubelet-client
