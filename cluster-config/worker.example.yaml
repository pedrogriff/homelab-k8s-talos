# ==============================================================================
# Talos Linux Worker Node Configuration (Template Example)
# ==============================================================================
# Use this template when scaling the cluster with additional worker VMs.

version: v1alpha1
machine:
  type: worker
  install:
    disk: /dev/sda
    image: factory.talos.dev/installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515:v1.13.8 # QEMU Guest Agent bundled
    wipe: false
  features:
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
cluster:
  controlPlane:
    endpoint: https://10.0.0.170:6443
  network:
    cni:
      name: flannel
