# ==============================================================================
# Talos Linux Worker Node Configuration (Template Example)
# ==============================================================================
# Use this template when scaling the cluster with additional worker VMs.

version: v1alpha1
machine:
  type: worker
  install:
    disk: /dev/sda
    image: factory.talos.dev/installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.13.8 # Standard Talos installer (no virtio guest-agent dependency)
    wipe: false
  features:
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
cluster:
  controlPlane:
    endpoint: https://10.0.0.170:6443
  network:
    cni:
      name: flannel
