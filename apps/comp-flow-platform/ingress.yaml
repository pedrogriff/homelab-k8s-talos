apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compflow-api-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - compflow.10.0.0.170.nip.io
    - compflow.homelab.local
    secretName: compflow-tls
  rules:
  - host: compflow.10.0.0.170.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: compflow-api
            port:
              number: 80
  - host: compflow.homelab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: compflow-api
            port:
              number: 80
