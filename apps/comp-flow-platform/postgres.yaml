apiVersion: v1
kind: Secret
metadata:
  name: compflow-postgres-secret
  namespace: default
type: Opaque
stringData:
  POSTGRES_DB: compflow
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: compflow-prod-db-password-2026
---
apiVersion: v1
kind: Service
metadata:
  name: compflow-postgres
  namespace: default
  labels:
    app: compflow-postgres
spec:
  ports:
  - port: 5432
    name: postgresql
  clusterIP: None
  selector:
    app: compflow-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: compflow-postgres
  namespace: default
  labels:
    app: compflow-postgres
spec:
  serviceName: compflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: compflow-postgres
  template:
    metadata:
      labels:
        app: compflow-postgres
    spec:
      containers:
      - name: postgresql
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: compflow-postgres-secret
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: compflow-postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: compflow-postgres-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgresql
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - compflow
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - compflow
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            memory: 512Mi
            cpu: 500m
          requests:
            memory: 256Mi
            cpu: 100m
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 10Gi
