apiVersion: v1
kind: ConfigMap
metadata:
  name: compensation-mcp-code
  namespace: default
data:
  server.py: |
    from enum import Enum
    from typing import Dict, Any, List
    from fastapi import FastAPI, Response, status
    from mcp.server.fastmcp import FastMCP
    from pydantic import BaseModel, Field

    mcp = FastMCP("Google-Compensation-MCP-Engine")

    class VestingScheduleType(str, Enum):
        FRONT_LOADED_33_33_22_12 = "FRONT_LOADED_33_33_22_12"
        STANDARD_EQUAL_4YR = "STANDARD_EQUAL_4YR"

    class VestingRequest(BaseModel):
        total_shares: int = Field(description="Total equity grant units", ge=1)
        schedule_type: VestingScheduleType = Field(
            default=VestingScheduleType.FRONT_LOADED_33_33_22_12,
            description="Vesting schedule model"
        )

    @mcp.tool()
    def calculate_equity_vesting(req: VestingRequest) -> Dict[str, Any]:
        percentages = [0.33333333, 0.33333333, 0.22222222, 0.11111111] if req.schedule_type == VestingScheduleType.FRONT_LOADED_33_33_22_12 else [0.25] * 4
        floored = [int(req.total_shares * p) for p in percentages]
        remainders = [req.total_shares * p - f for p, f in zip(percentages, floored)]
        
        for i in sorted(range(len(remainders)), key=lambda k: remainders[k], reverse=True)[:req.total_shares - sum(floored)]:
            floored[i] += 1

        return {
            "total_granted": req.total_shares,
            "schedule_model": req.schedule_type.value,
            "tranches": {
                "year_1": floored[0],
                "year_2": floored[1],
                "year_3": floored[2],
                "year_4": floored[3],
            },
            "sum_invariant_verified": sum(floored) == req.total_shares
        }

    class BandStatus(str, Enum):
        BELOW_MINIMUM = "BELOW_MINIMUM"
        IN_BAND = "IN_BAND"
        ABOVE_MAXIMUM = "ABOVE_MAXIMUM"
        VP_APPROVAL_REQUIRED = "VP_APPROVAL_REQUIRED"

    class SalaryAuditRequest(BaseModel):
        proposed_salary: float = Field(description="Proposed annual base salary in USD", gt=0)
        job_level: str = Field(description="Google Job Level (e.g. 'L4', 'L5', 'L6', 'L7')")
        location: str = Field(description="Office location code (e.g. 'US-MTV', 'US-NYC')")

    SALARY_BANDS: Dict[tuple, Dict[str, float]] = {
        ("L6", "US-MTV"): {"min": 190000.0, "mid": 220000.0, "max": 250000.0},
        ("L5", "US-MTV"): {"min": 150000.0, "mid": 175000.0, "max": 200000.0},
        ("L4", "US-MTV"): {"min": 120000.0, "mid": 140000.0, "max": 160000.0},
        ("L6", "US-NYC"): {"min": 195000.0, "mid": 225000.0, "max": 255000.0},
        ("L5", "US-NYC"): {"min": 155000.0, "mid": 180000.0, "max": 205000.0},
    }

    @mcp.tool()
    def audit_salary_band_compliance(req: SalaryAuditRequest) -> Dict[str, Any]:
        grid_key = (req.job_level, req.location)
        band = SALARY_BANDS.get(grid_key, {"min": 150000.0, "mid": 175000.0, "max": 200000.0})
        compa_ratio = round(req.proposed_salary / band["mid"], 4)

        if req.proposed_salary < band["min"]:
            status_val = BandStatus.BELOW_MINIMUM
        elif req.proposed_salary > band["max"] or compa_ratio > 1.20:
            status_val = BandStatus.VP_APPROVAL_REQUIRED
        else:
            status_val = BandStatus.IN_BAND

        return {
            "job_level": req.job_level,
            "location": req.location,
            "proposed_salary": req.proposed_salary,
            "band_min": band["min"],
            "band_mid": band["mid"],
            "band_max": band["max"],
            "compa_ratio": compa_ratio,
            "compa_ratio_percentage": f"{round(compa_ratio * 100, 2)}%",
            "compliance_status": status_val.value,
            "requires_exception_workflow": status_val == BandStatus.VP_APPROVAL_REQUIRED
        }

    app = FastAPI(title="Google Compensation MCP API", version="1.0.0")

    @app.get("/healthz", status_code=status.HTTP_200_OK)
    async def health_check():
        return {"status": "HEALTHY", "service": "compensation-mcp-engine"}

    @app.post("/api/v1/vesting")
    async def api_vesting(req: VestingRequest):
        return calculate_equity_vesting(req)

    @app.post("/api/v1/salary-audit")
    async def api_salary_audit(req: SalaryAuditRequest):
        return audit_salary_band_compliance(req)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compensation-mcp
  namespace: default
  labels:
    app: compensation-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compensation-mcp
  template:
    metadata:
      labels:
        app: compensation-mcp
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - compensation-mcp
              topologyKey: kubernetes.io/hostname
      containers:
      - name: mcp-server
        image: python:3.13-slim
        command:
        - /bin/sh
        - -c
        - |
          pip install --no-cache-dir fastapi==0.115.8 uvicorn==0.34.0 mcp==1.3.0 pydantic==2.10.6 starlette==0.45.3 && \
          python -m uvicorn server:app --host 0.0.0.0 --port 8000 --app-dir /app
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            memory: 256Mi
            cpu: 200m
          requests:
            memory: 128Mi
            cpu: 100m
        volumeMounts:
        - name: code-volume
          mountPath: /app
      volumes:
      - name: code-volume
        configMap:
          name: compensation-mcp-code
---
apiVersion: v1
kind: Service
metadata:
  name: compensation-mcp
  namespace: default
  labels:
    app: compensation-mcp
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: compensation-mcp
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compensation-mcp-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - mcp.10.0.0.170.nip.io
    - mcp.homelab.local
    secretName: compensation-mcp-tls
  rules:
  - host: mcp.10.0.0.170.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: compensation-mcp
            port:
              number: 80
  - host: mcp.homelab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: compensation-mcp
            port:
              number: 80
